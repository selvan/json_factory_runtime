name: json_factory_runtime_generator
description: Build-time JSON factory generator for json_serializable classes. Decodes JSON to the right class from a key in the JSON, with no base class, mixin or toJson changes.
version: 0.3.1
repository: https://github.com/selvan/json_factory_runtime/tree/main/packages/json_factory_runtime_generator
issue_tracker: https://github.com/selvan/json_factory_runtime/issues
topics:
  - json
  - serialization
  - codegen
  - build-runner
  - polymorphism

environment:
  sdk: ^3.5.0

# build 4.0.11+ and source_gen 4.2.4+ keep this usable next to builders that
# haven't moved to build 5 yet, such as mobx_codegen.
dependencies:
  analyzer: ^14.7.0
  build: ">=4.0.11 <6.0.0"
  dart_style: ^3.1.14
  glob: ^2.2.0
  json_factory_runtime_annotation: ^0.3.0
  source_gen: ">=4.2.4 <5.0.0"
dev_dependencies:
  build_runner: ">=2.16.2 <3.0.0"
  build_test: ">=3.5.21 <4.0.0"
  json_annotation: ^4.12.0
  lints: ^6.1.0
  meta: ^1.19.0
  test: ^1.33.0
