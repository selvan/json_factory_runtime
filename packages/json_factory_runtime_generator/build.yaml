builders:
  json_factory_collector:
    import: "package:json_factory_runtime_generator/json_factory_runtime_generator.dart"
    builder_factories: ["jsonFactoryCollector"]
    build_extensions: {".dart": [".json_factory.json"]}
    auto_apply: dependents
    build_to: cache
    applies_builders: ["json_factory_runtime_generator:json_factory_aggregator"]
    defaults:
      generate_for: ["lib/**"]

  json_factory_aggregator:
    import: "package:json_factory_runtime_generator/json_factory_runtime_generator.dart"
    builder_factories: ["jsonFactoryAggregator"]
    build_extensions: {"$lib$": ["generated/json_factory_runtime.g.dart"]}
    required_inputs: [".json_factory.json"]
    # So json_serializable can resolve the generated mapper in
    # `@JsonKey(toJson: JsonFactoryMapper.toJsonForFactory)`. It silently drops
    # that annotation if the mapper isn't there yet.
    runs_before: ["json_serializable"]
    auto_apply: dependents
    build_to: source
